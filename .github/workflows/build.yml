name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MLauncher
          path: MLauncher.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MLauncher 1.0.${{ github.run_number }}
          files: MLauncher.apk
