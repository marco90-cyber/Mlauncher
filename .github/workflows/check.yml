name: Check branch

# Compila i rami di lavoro (non main) per scoprire subito gli errori: niente firma, niente release.
on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleDebug lintVitalRelease --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|What went wrong|Execution failed| FAILED$|AssertionError|ComparisonFailure" build.log | sed -E "s#file:///home/runner/work/Mlauncher/Mlauncher/app/src/(main|test)/java/com/marco/mlauncher/##" | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
