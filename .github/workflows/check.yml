name: Check branch

# Compila i rami di lavoro (non main): test, lint e APK firmato da scaricare. Niente release.
on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|What went wrong|Execution failed| FAILED$|AssertionError|ComparisonFailure" build.log | sed -E "s#file:///home/runner/work/Mlauncher/Mlauncher/app/src/(main|test)/java/com/marco/mlauncher/##" | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MLauncher-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MLauncher-test
          path: MLauncher-test.apk
